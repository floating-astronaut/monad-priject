[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200


# BE-2. Pinned so a fuzz run is reproducible across machines and CI, rather
# than depending on whatever default the local toolchain ships.
[fuzz]
runs = 512
max_test_rejects = 200000

[invariant]
runs = 256
depth = 500
fail_on_revert = false

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
